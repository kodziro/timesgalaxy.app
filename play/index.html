<style>
/* Self-hosted fonts (SIL OFL 1.1, licenses in ../fonts/): no request to a third party, and they work offline. Nunito is a variable font, one file covers weights 600-900. */
@font-face { font-family: "Lilita One"; font-style: normal; font-weight: 400; font-display: swap; src: url("../fonts/lilita-one-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Lilita One"; font-style: normal; font-weight: 400; font-display: swap; src: url("../fonts/lilita-one-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

@font-face { font-family: "Nunito"; font-style: normal; font-weight: 200 1000; font-display: swap; src: url("../fonts/nunito-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
/* Layout: one centered game column (max 540px) that fills the screen height; keypad pinned to the bottom of each play screen. Single dark "deep space" look on purpose. */
:root {
  --space: #0B1033;
  --deep: #1A2259;
  --panel: #141B48;
  --line: #3A4590;
  --ink: #FFFFFF;
  --muted: #A9B3E8;
  --soft: #C9CFF2;
  --cyan: #3DE0FF;
  --pink: #FF4FD8;
  --lime: #B8FF3D;
  --amber: #FFB547;
  --violet: #9B7BFF;
  --coral: #FF8A9A;
  --on-bright: #0B1033;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background-color: var(--space);
  background-image:
    radial-gradient(2px 2px at 8% 12%, #ffffffaa 50%, transparent 51%),
    radial-gradient(2px 2px at 82% 8%, #ffffff88 50%, transparent 51%),
    radial-gradient(3px 3px at 64% 30%, #ffffff66 50%, transparent 51%),
    radial-gradient(2px 2px at 22% 48%, #ffffff77 50%, transparent 51%),
    radial-gradient(2px 2px at 92% 58%, #ffffff88 50%, transparent 51%),
    radial-gradient(3px 3px at 12% 80%, #ffffff55 50%, transparent 51%),
    radial-gradient(2px 2px at 54% 90%, #ffffff77 50%, transparent 51%),
    radial-gradient(2px 2px at 40% 18%, #ffffff55 50%, transparent 51%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
#app {
  max-width: 540px; margin: 0 auto; min-height: 100%;
  padding-inline: 16px; padding-block: 16px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.grow { flex: 1; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; }
.display { font-family: var(--display); letter-spacing: 0.5px; line-height: 1.05; }
.eyebrow { font-size: 13px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--cyan); }
.muted { color: var(--muted); }
.h1 { font-family: var(--display); font-size: clamp(28px, 7vw, 36px); line-height: 1.05; margin: 0; text-wrap: balance; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 22px; padding: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-weight: 900; font-size: 15px; background: var(--deep); border: 2px solid var(--line); }
.btn { border: 0; border-radius: 20px; min-height: 60px; padding: 0 20px; font-family: var(--display); font-size: 22px; letter-spacing: 0.5px; background: var(--cyan); color: var(--on-bright); box-shadow: 0 0 22px #3DE0FF66; width: 100%; }
.btn.secondary { background: var(--panel); color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
.btn.amber { background: var(--amber); box-shadow: 0 0 22px #FFB54766; }
.btn.small { min-height: 46px; font-size: 18px; width: auto; }
.btn:disabled { opacity: 0.45; box-shadow: none; }
.link { background: none; border: 0; color: var(--soft); font-weight: 800; text-decoration: underline; padding: 6px; }

/* Zib + speech bubble */
.zibline { display: flex; align-items: flex-end; gap: 6px; }
.zibline svg { flex-shrink: 0; }
.bubble { background: var(--ink); color: var(--on-bright); border-radius: 18px 18px 18px 4px; padding: 10px 14px; font-weight: 800; font-size: 17px; line-height: 1.3; margin-bottom: 18px; min-width: 0; }

/* Question area */
.qcard { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 28px; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.q { font-family: var(--display); font-size: clamp(60px, 18vw, 96px); line-height: 1; font-variant-numeric: tabular-nums; }
.answer { min-width: 150px; height: 76px; border-radius: 18px; border: 3px solid var(--cyan); box-shadow: 0 0 16px #3DE0FF55; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 48px; padding: 0 18px; font-variant-numeric: tabular-nums; }
.answer.empty { border-style: dashed; border-color: var(--line); box-shadow: none; color: var(--line); }
.answer.ok { border-color: var(--lime); box-shadow: 0 0 18px #B8FF3D88; }
.answer.bad { border-color: var(--coral); box-shadow: none; }
.feedback { min-height: 34px; display: flex; align-items: center; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 14px; font-weight: 900; font-size: 16px; }
.chip.boost { background: #B8FF3D22; border: 2px solid var(--lime); color: #DFFFA8; }
.chip.ok { background: #3DE0FF22; border: 2px solid var(--cyan); color: #BFF6FF; }
.chip.combo { background: #FF4FD822; border: 2px solid var(--pink); color: #FFC4F1; }

.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.key { min-height: clamp(54px, 8vh, 74px); border-radius: 18px; background: var(--panel); border: 2px solid var(--line); font-family: var(--display); font-size: 30px; }
.key.go { background: var(--cyan); color: var(--on-bright); border: 0; }
.key:active { transform: translateY(2px); }

.dots { display: grid; gap: 3px; flex: 1; }
.dots span { height: 10px; border-radius: 3px; background: #1F2866; }
.dots span.done { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
.dots span.now { background: var(--amber); }
.iconbtn { width: 46px; height: 46px; border-radius: 14px; background: var(--deep); border: 2px solid var(--line); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Planets in the first flight strip */
.strip { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.strip.ten { grid-template-columns: repeat(10, minmax(0, 1fr)); }
.strip div { aspect-ratio: 1; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: clamp(10px, 2.6vw, 14px); background: var(--panel); border: 2px dashed var(--line); color: #6A74B8; }
.strip div.known { background: var(--cyan); border: 0; color: var(--on-bright); box-shadow: 0 0 10px var(--cyan); }
.strip div.new { background: var(--deep); border: 2px solid var(--line); color: var(--muted); }
.strip div.asking { border: 3px solid var(--amber); color: var(--amber); }

/* Galaxy map */
.map { display: flex; flex-direction: column; gap: 6px; padding-block: 6px; }
.node { display: flex; align-items: center; gap: 14px; background: none; border: 0; padding: 4px; text-align: left; width: 100%; }
.node:nth-child(even) { flex-direction: row-reverse; text-align: right; }
.planet { flex-shrink: 0; width: 72px; height: 72px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 24px; color: var(--on-bright); position: relative; }
.planet.locked { background: var(--panel); border: 2px dashed var(--line); color: #6A74B8; }
.planet.current { width: 88px; height: 88px; font-size: 30px; border: 4px solid var(--ink); }
.planet .gold { position: absolute; right: -4px; top: -4px; width: 26px; height: 26px; border-radius: 999px; background: var(--amber); border: 2px solid var(--space); display: flex; align-items: center; justify-content: center; }
.nodeinfo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.nodeinfo b { font-size: 17px; }
.nodeinfo span { font-size: 14px; color: var(--muted); font-weight: 700; }
.tag { align-self: flex-start; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 900; }
.node:nth-child(even) .tag { align-self: flex-end; }
.tag.claim { background: var(--amber); color: var(--on-bright); }
.tag.now { background: var(--cyan); color: var(--on-bright); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; font-weight: 700; color: var(--muted); }
.factchips { display: flex; flex-wrap: wrap; gap: 8px; }
.factchips span { background: var(--cyan); color: var(--on-bright); border-radius: 10px; padding: 4px 12px; font-family: var(--display); font-size: 19px; }
.bar { height: 14px; border-radius: 999px; background: #1F2866; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cyan); border-radius: 999px; }

.galaxy { position: relative; width: 100%; height: clamp(380px, 52vh, 560px); }
.galaxy > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mplanet { border: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: var(--display); padding: 0; }
.mplanet:disabled { cursor: default; }
.mplanet .gold, .mplanet .rbadge, .mplanet .claimdot { position: absolute; right: -6px; top: -6px; width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--space); }
.mplanet .rbadge { background: var(--deep); }
.mplanet .claimdot { background: var(--amber); }
.mplanet .gold { background: var(--amber); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

/* Grown-ups panel */
.gp { background: #F3F5FF; color: #0B1033; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.gp h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; }
.gp h3 { margin: 0; font-size: 17px; font-weight: 900; }
.gp .box { background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.gp label { font-weight: 800; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.gp input[type=text], .gp input[type=number], .gp select { border: 2px solid #D5DAF2; border-radius: 12px; padding: 8px 10px; background: #FFFFFF; color: #0B1033; color-scheme: light; }
.gp .check { flex-direction: row; align-items: center; gap: 10px; }
.gp .check input { width: 22px; height: 22px; }
.gp .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .gp .grid2 { grid-template-columns: minmax(0, 1fr); } }
.gp .early { background: #FFF3DC; border: 2px solid #FFB547; border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 800; color: #0B1033; margin: 0; }
.rate { align-items: center; text-align: center; gap: 10px; }
.faces { display: flex; justify-content: center; gap: 14px; }
.face { background: none; border: 0; padding: 4px; border-radius: 999px; min-width: 72px; min-height: 72px; }
.face:active { transform: scale(0.94); }
.gp .stars { display: flex; gap: 4px; }
.gp .star { background: none; border: 0; padding: 4px; min-width: 48px; min-height: 48px; border-radius: 10px; }
.gp .chips { display: flex; flex-wrap: wrap; gap: 8px; }
.gp .chip2 { border: 2px solid #D5DAF2; border-radius: 999px; min-height: 40px; padding: 0 14px; background: #FFFFFF; color: #0B1033; font-weight: 800; }
.gp .chip2.on { background: #2A3BB0; border-color: #2A3BB0; color: #FFFFFF; }
.gp .hint { background: #E3F8FF; border: 2px solid #3DE0FF; border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 800; color: #0B1033; display: flex; flex-direction: column; gap: 8px; }
.gp .note { font-size: 13px; color: #3D4680; font-weight: 700; }
.gp .gbtn { border: 0; border-radius: 12px; min-height: 44px; padding: 0 14px; font-weight: 900; background: #2A3BB0; color: #FFFFFF; }
.gp .gbtn.light { background: #E2E6FA; color: #0B1033; }
.gp .gbtn.danger { background: #B3261E; color: #FFFFFF; }
.gp .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.gp .tile { background: #FFFFFF; border-radius: 14px; padding: 10px; }
.gp .tile b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
.gp .tile span { font-size: 12px; font-weight: 800; color: #3D4680; }
.fgwrap { overflow-x: auto; }
.fg { border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
.fg th { font-size: 11px; color: #3D4680; font-weight: 900; width: 24px; height: 22px; }
.fg td { width: 24px; height: 24px; border-radius: 5px; }
.fg td.m { background: #E59A12; } .fg td.l { background: #3DA9E0; } .fg td.s { background: #F2B8C0; } .fg td.n { background: #E2E6FA; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; font-weight: 800; color: #3D4680; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.logwrap { overflow-x: auto; max-height: 320px; overflow-y: auto; border: 1px solid #E3E7F7; border-radius: 10px; }
.log { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.log th, .log td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #E3E7F7; white-space: nowrap; }
.log th { position: sticky; top: 0; background: #F3F5FF; }
.log .bad { color: #B3261E; font-weight: 900; }
.log .ok { color: #1B7A3A; font-weight: 900; }
textarea.copy { width: 100%; height: 120px; font-family: ui-monospace, monospace; font-size: 12px; color: #0B1033; background: #FFFFFF; border: 2px solid #D5DAF2; border-radius: 10px; color-scheme: light; }

.hold { position: relative; overflow: hidden; }
.hold::after { content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--amber); }
.hold.holding::after { width: 100%; transition: width 1.5s linear; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { .hold.holding::after { transition: none; } .pop { animation: none !important; } }
.pop { animation: pop 0.35s ease-out; }
@keyframes pop { from { transform: scale(0.85); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
.chip.review { background: #FFB54722; border: 2px solid var(--amber); color: #FFE2B0; }
.parade { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; min-height: 90px; }
.parade div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--display); font-size: 18px; animation: flyin 0.7s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes flyin { from { transform: translateY(120px) scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
.launch { animation: launch 1.6s ease-in 0.4s both; }
@keyframes launch { 0% { transform: translateY(0); } 15% { transform: translateY(6px); } 100% { transform: translateY(-120px); } }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: var(--muted); }
.week i { width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: var(--deep); border: 2px solid var(--line); font-style: normal; }
.week i.on { background: var(--amber); border: 0; box-shadow: 0 0 10px var(--amber); }
.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.swatch { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 900; }
.swatch.sel { border-color: var(--cyan); box-shadow: 0 0 14px #3DE0FF66; }
.hangar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.hangar div { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: var(--display); font-size: 15px; color: var(--muted); }
.cert { background: #FFF8EC; color: #0B1033; border-radius: 22px; padding: 22px 18px; border: 6px double #FFB547; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.cert .big { font-family: var(--display); font-size: clamp(30px, 8vw, 40px); line-height: 1.05; }
.cert .rk { display: grid; grid-template-columns: repeat(6, auto); justify-content: center; gap: 4px 6px; } /* 12 rockets = two rows of 6 (10 × 10 setting: 6 + 4) */
.cert .line { width: 70%; border-top: 2px solid #E8D8B8; margin-top: 6px; }
.dotgrid { display: grid; gap: 4px; justify-content: center; }
.dotgrid i { width: var(--d, 12px); height: var(--d, 12px); border-radius: 999px; display: block; }
.meet { border-color: var(--cyan); align-items: center; text-align: center; gap: 16px; padding: 22px 16px; }
.howto { font-weight: 800; color: var(--soft); font-size: 17px; }
/* dot pictures: rows match the trick, running totals so the child never counts single dots */
.dp { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.dprow { display: flex; align-items: center; gap: 4px; }
.dprow.gap { margin-top: 7px; }
.dprow i { width: var(--d); height: var(--d); border-radius: 999px; display: block; flex-shrink: 0; }
.dprow i.g { margin-left: 7px; }
.dprow i.h { background: transparent !important; border: 2px dashed var(--muted); }
.dprow b { min-width: 46px; margin-left: 8px; font-family: var(--display); font-weight: 400; font-size: calc(var(--d) + 3px); line-height: 1; color: var(--amber); text-align: left; }
.bubble[data-say] { cursor: pointer; }
.bubble .spk { display: inline-block; margin-left: 6px; opacity: 0.55; vertical-align: -2px; }
.goal { display: flex; align-items: center; gap: 12px; }
.goal .bar { flex: 1; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) { .parade div, .launch { animation: none; } }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  "use strict";

  function flightAnswer(given) {
    var q = T.qs[T.i], secs = (performance.now() - T.start) / 1000, ok = given !== null && +given === q.a * q.b;
    record("first flight", q, given === null ? "skip" : given, ok, secs);
    T.res[q.k] = ok; T.fb = ok ? "ok" : "bad"; T.msg = ok ? pick(LINES_OK) + " Next one." : "No problem. Next one!";

    if (ok) sfx("ok");
    order().forEach(function (t) {
      if (T.done[t] || T.stopped) return;
      var ks = HARD[t].filter(function (b) { return b <= S.max; }).map(function (b) { return key(t, b); });
      if (!ks.every(function (k) { return k in T.res; })) return;

      T.done[t] = known ? "known" : "new";

        for (var a = 1; a <= Math.min(10, S.max); a++) { var kk = key(t, a); learnFact(kk, easy(kk) ? 2 + Math.floor(Math.random() * 4) : 1); }

  // ----- planet page -----
  function vPlanet() {

      else if (!S.mainDone[S.day]) actions = '<button class="btn" id="goLaunch">Launch today’s mission</button>';

  // ----- missions -----
  function buildMission(kind) {
    var t = current(), len = kind === "bonus" ? BONUS_LEN : mainLen();
    var pf = t ? planetFacts(t) : [];
    var prio = function (k) { var f = F(k); return (easy(k) ? 0 : 3) - (mastered(k) ? 2 : 0) + Math.min(f.wrong, 3) + Math.min(S.day - f.due, 4) * 0.5; };
    var reviews = shuffle(dueFacts().filter(function (k) { return pf.indexOf(k) < 0; })).sort(function (a, b) { return prio(b) - prio(a); });
    var allPlanetLearned = pf.every(learned);
    var cap = !t ? len : kind === "bonus" ? Math.ceil(len / 2) : allPlanetLearned ? Math.round(len * 0.6) : Math.round(len * 0.4);
    reviews = reviews.slice(0, cap);
    if (!t && reviews.length < len) { // patrol: top up with the weakest learned facts
      var extra = allFacts().filter(function (k) { return learned(k) && reviews.indexOf(k) < 0; }).sort(function (a, b) { return F(a).days.length - F(b).days.length; });
      reviews = reviews.concat(extra.slice(0, len - reviews.length));
    }
    if (!t) { var pi = shuffle(reviews.map(function (k) { var q = orient(k); q.review = homePlanet(k); return q; })); return pi; }

    // 1. New facts are PLANNED: at most S.newCap per mission (3 to start), easiest first, never in a bonus.
    //    Each one: new-fact card + practice answer at slot 1, 1+gap, …; its real question 5 slots later.
    var other = function (k) { var p = parts(k); return p[0] === t ? p[1] : p[0]; };
    var unmet = pf.filter(function (k) { var f = F(k); return !learned(k) && !f.met && f.correct === 0; }).sort(function (a, b) { return other(a) - other(b); });
    var nNew = kind === "bonus" ? 0 : Math.min(unmet.length, S.newCap || NEW_MIN);
    while (nNew > 0 && 1 + (nNew - 1) * 3 + 5 > len - 1) nNew--;   // at least 2 normal questions between new-fact cards
    var gap = nNew > 1 ? Math.max(3, Math.min(4, Math.floor((len - 7) / (nNew - 1)))) : 0;
    var slots = new Array(len), i;
    for (i = 0; i < nNew; i++) {
      var meet = orient(unmet[i], t); meet.isNew = true; meet.review = false; slots[1 + i * gap] = meet;
      var real = orient(unmet[i], t); real.review = false; real.realOf = true; slots[6 + i * gap] = real;
    }
    // 2. Reviews (spaced) and planet practice fill the other slots. Planet practice slots can later be
    //    swapped for a retry of a wrong answer, so the mission never gets longer than shown.
    var free = len - nNew * 2;
    reviews = reviews.slice(0, Math.max(0, Math.min(reviews.length, free - 2)));
    var met = pf.filter(function (k) { var f = F(k); return !learned(k) && (f.met || f.correct > 0) && unmet.slice(0, nNew).indexOf(k) < 0; });
    var prac = pf.filter(function (k) { return learned(k) && !mastered(k); });
    var pool = met.concat(met, prac);
    if (!pool.length) pool = pf.filter(learned);
    if (!pool.length) pool = pf.slice();
    var fill = [];
    while (fill.length < free - reviews.length) fill = fill.concat(shuffle(pool.slice()));
    fill = fill.slice(0, free - reviews.length).map(function (k) { var q = orient(k, t); q.review = false; q.filler = true; return q; });
    var rest = shuffle(reviews.map(function (k) { var q = orient(k); q.review = homePlanet(k); return q; }).concat(fill));
    // warm-up: start with something the child has seen before (a review or planet practice)
    for (i = 0; i < len; i++) if (!slots[i]) slots[i] = rest.shift();
    // one extra look at each new fact near the end (third exposure), on a practice slot after its real question
    for (i = 0; i < nNew; i++) for (var j = Math.min(len - 1, 6 + i * gap + 4); j < len; j++) if (slots[j] && slots[j].filler) { var x = orient(unmet[i], t); x.review = false; slots[j] = x; break; }

        rows += '<td class="' + cls + '" title="' + r + " × " + c2 + ": right " + f.correct + " of " + (f.correct + f.wrong) + (f.tn ? ", avg " + (f.tsum / f.tn).toFixed(1) + " s" : "") + ", days " + f.days.length + "/3" + (f.due !== null ? ", next review day " + f.due : "") + '"></td>'; }
      rows += "</tr>"; }
    var hard = all.filter(function (k) { return F(k).wrong > 0; }).sort(function (a, b) { return (F(b).wrong / (F(b).correct + F(b).wrong)) - (F(a).wrong / (F(a).correct + F(a).wrong)) || F(b).wrong - F(a).wrong; }).slice(0, 8);
    var hardHtml = hard.length ? '<ul style="margin:0;padding-left:18px">' + hard.map(function (k) { var f = F(k), p = parts(k); return "<li><b>" + p[0] + " × " + p[1] + "</b>: right " + f.correct + " of " + (f.correct + f.wrong) + (f.tn ? ", average " + (f.tsum / f.tn).toFixed(1) + " s" : "") + "</li>"; }).join("") + "</ul>" : '<p class="note" style="margin:0">No mistakes yet.</p>';
    var logRows = S.log.slice(-200).reverse().map(function (e) { return "<tr><td>" + e.day + "</td><td>" + e.at + "</td><td>" + esc(e.mode) + "</td><td>" + e.q + "</td><td>" + esc(e.given) + "</td><td class=\"" + (e.ok ? "ok" : "bad") + "\">" + (e.ok ? "right" : "wrong (" + e.right + ")") + "</td><td>" + e.s + " s</td></tr>"; }).join("");
    var today = S.log.filter(function (e) { return e.day === S.day; }), rightN = today.filter(function (e) { return e.ok; }).length;
    var mins = (today.reduce(function (a, e) { return a + e.s; }, 0) / 60).toFixed(1);
    return '<div class="gp"><div class="row between"><h2>Grown-ups</h2><button class="gbtn" id="gpClose">Back to the game</button></div>' + earlyNote() + installHint() +
      '<p class="note" style="margin:0">Progress for ' + (S.name ? esc(S.name) : "the child") + '. Day ' + S.day + ' · today ' + today.length + ' answers, ' + rightN + ' right, about ' + mins + ' min answering · streak ' + streak() + ' · speed goal now ' + (S.relaxed ? "off" : goal() + " s") + ' · new facts per mission now ' + (S.newCap || NEW_MIN) + '.</p>' + tiles + parentRating() +
      '<div class="box"><h3>All facts</h3><div class="fgwrap"><table class="fg">' + head + rows + '</table></div>' +
      '<div class="legend"><span><i style="background:#E59A12"></i>Mastered (easy facts: 1 day, others: 3 days)</span><span><i style="background:#3DA9E0"></i>Learned</span><span><i style="background:#F2B8C0"></i>Tried, not learned</span><span><i style="background:#E2E6FA"></i>Not seen</span></div></div>' +
      '<div class="box"><h3>Facts that were hard</h3>' + hardHtml + '</div>' + saveCodeBox() +
      (TEST ? '<div class="box"><h3>Test tools</h3><p class="note" style="margin:0">One mission per day (plus one bonus). Use “Next day” to simulate tomorrow: due reviews and the next mission appear.</p>' +
      '<div class="row wrap"><button class="gbtn" id="nextDay">Next day (now day ' + S.day + ')</button><button class="gbtn light" id="redoFlight">Run the first flight again</button></div></div>' : "") +
      '<div class="box"><h3>Start over</h3>' +
      (gpConfirm ? '<div class="row wrap"><b>Delete all progress for this child?</b><button class="gbtn danger" id="resetYes">Yes, reset</button><button class="gbtn light" id="resetNo">Cancel</button></div>' : '<button class="gbtn light" id="resetAsk" style="align-self:flex-start">Reset this child</button>') + '</div>' +
      settingsForm(false) +
      '<div class="box"><div class="row between wrap"><h3>Answer log (newest first)</h3><button class="gbtn" id="copyLog">Copy log as CSV</button></div>' + (gpCopy ? '<p class="note" style="margin:0">' + esc(gpCopy) + '</p>' : "") +
      '<textarea class="copy" id="csvBox" readonly hidden aria-label="Log as CSV"></textarea>' +
      '<div class="logwrap"><table class="log"><tr><th>Day</th><th>Time</th><th>Where</th><th>Question</th><th>Typed</th><th>Result</th><th>Time</th></tr>' + (logRows || '<tr><td colspan="7">No answers yet.</td></tr>') + '</table></div></div></div>';
  }
  function csv() { var l = ["day,time,where,question,typed,correct_answer,result,seconds"]; S.log.forEach(function (e) { l.push([e.day, e.at, e.mode, '"' + e.q + '"', e.given, e.right, e.ok ? "right" : "wrong", e.s].join(",")); }); return l.join("\n"); }

  // ---------- events ----------
  function readSettings() {
    var g = function (id) { return document.getElementById(id); };
    if (!g("f-name")) return;
    S.name = g("f-name").value.trim().slice(0, 20); S.speed = +g("f-speed").value; S.max = +g("f-max").value;
    S.relaxed = g("f-relaxed").checked; S.voice = g("f-voice").checked; S.sound = g("f-sound").checked; S.readQ = g("f-readq").checked;
    S.len = Math.max(5, Math.min(40, +g("f-len").value || 20));
    if (S.flightDone) order().forEach(function (t) { if (!S.planets[t]) S.planets[t] = "locked"; });
    save();
  }
  function openGrownups() { if (view === "play" || view === "flight") return; returnView = view; gpConfirm = false; gpCopy = ""; gpCode = ""; gpLoad = null; gpStars = 0; gpChip = ""; view = "grownups"; render(); window.scrollTo(0, 0); }
  function go(v) { confettiRun++; view = v; render(); window.scrollTo(0, 0); }

  document.addEventListener("change", function (e) { if (e.target.id && e.target.id.indexOf("f-") === 0) { readSettings(); if (view === "grownups") render(); } });
  document.addEventListener("click", function (e) {
    var bub = e.target.closest(".bubble[data-say]"); if (bub) { say(bub.getAttribute("data-say")); return; }
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    audio();
    if (b.dataset.hat) {
      var hid = b.dataset.hat, hp = HATS.filter(function (x) { return x[0] === hid; })[0];
      T = T || {}; T.paintMsg = "";
      if (S.hat === hid) S.hat = "none";
      else if (S.hats.indexOf(hid) >= 0) S.hat = hid;
      else if (S.crystals >= hp[2]) { S.crystals -= hp[2]; S.hats.push(hid); S.hat = hid; sfx("win"); confetti(); }
      else T.paintMsg = "You need " + (hp[2] - S.crystals) + " more crystals. Keep flying!";
      save(); render(); return;
    }
    if (b.dataset.k) return onKey(b.dataset.k);
    if (b.dataset.rate) {
      if (!T || !T.askRating || (S.childRated && S.childRated[S.day])) return;
      var rv = +b.dataset.rate; S.childRated = S.childRated || {}; S.childRated[S.day] = rv; save(); sfx("ok");
      signal("rating_child", { value: rv, day: S.day }); render(); return;
    }
    if (b.dataset.stars) { gpStars = +b.dataset.stars; render(); return; }
    if (b.dataset.chip) { gpChip = gpChip === b.dataset.chip ? "" : b.dataset.chip; render(); return; }
    if (b.dataset.planet) { openPlanet = +b.dataset.planet; go("planet"); return; }
    if (b.dataset.paint) {
      var c = b.dataset.paint, p = PAINTS.filter(function (x) { return x[0] === c; })[0];
      T = T || {}; T.paintMsg = "";
      if (S.owned.indexOf(c) >= 0) S.ship = c;
      else if (S.crystals >= p[2]) { S.crystals -= p[2]; S.owned.push(c); S.ship = c; sfx("win"); confetti(); }
      else { T.paintMsg = "You need " + (p[2] - S.crystals) + " more crystals. Keep flying!"; }
      save(); render(); return;
    }
    switch (b.id) {
      case "startSetup": readSettings(); go("intro"); break;
      case "takeoff": startFlight(); break;
      case "dunno": if (!busy && T && T.type === "flight") flightAnswer(null); break;
      case "toMap": T = null; go("map"); break;
      case "backMap": T = null; go("map"); break;
      case "toCert": T = null; go("certificate"); setTimeout(confetti, 200); break;
      case "toHangar": case "toHangar2": T = null; go("hangar"); break;
      case "goLaunch": startMission("main"); break;
      case "goBonus": startMission("bonus"); break;
      case "goChallenge": startChallenge(current()); break;
      case "startChallenge": startChallenge(openPlanet); break;
      case "gotit": gotIt(); break;
      case "quit": if (T && (T.type === "mission" || T.type === "challenge")) { T.paused = true; render(); } else { T = null; typed = ""; go(S.flightDone ? "map" : "intro"); } break;
      case "resume": T.paused = false; render(); T.start = performance.now(); break;
      case "stopMission": T = null; typed = ""; go("map"); break;
      case "meetGo":
        var mq = curQ(); F(mq.k).met = true; T.meet = null; mq.practice = true; T.introduced.push(mq.k);
        render(); T.start = performance.now(); break;
      case "gpClose": go(returnView === "grownups" || returnView === "setup" ? "map" : returnView); break;
      case "nextDay": if (TEST) { S.dayOffset = (S.dayOffset || 0) + 1; render(); } break;
      case "redoFlight": if (TEST) go("intro"); break;
      case "resetAsk": gpConfirm = true; render(); break;
      case "resetNo": gpConfirm = false; render(); break;
      case "hintOk": S.hintDone = true; save(); render(); break;
      case "sendRating":
        if (!gpStars || S.parentRated) break;
        S.parentRated = { value: gpStars, chip: gpChip || "none", day: S.day }; save();
        signal("rating_parent", { value: gpStars, chip: gpChip || "none" }); render(); break;
      case "copyCode":
        var cbox = document.getElementById("saveCode"), cmsg = document.getElementById("codeMsg"); if (!gpCode) break;
        var selectCode = function () { cbox.focus(); cbox.select(); cmsg.textContent = "Now copy the selected code."; };
        try { navigator.clipboard.writeText(gpCode).then(function () { cmsg.textContent = "Copied. Keep it somewhere safe."; signal("save_export"); }, selectCode); } catch (err) { selectCode(); }
        break;
      case "loadAsk":
        var lmsg = document.getElementById("loadMsg");
        readCode(document.getElementById("loadCode").value).then(function (s) { gpLoad = s; render(); if (view === "setup") { var d = document.querySelector("details"); if (d) d.open = true; } },
          function () { lmsg.textContent = "This code does not work. Check that you copied all of it."; });
        break;
      case "loadYes": var wasTest = S.testDevice; S = upgrade(gpLoad); if (wasTest) S.testDevice = true; else delete S.testDevice; gpLoad = null; gpConfirm = false; save(); T = null; go(S.flightDone ? "map" : "intro"); break;
      case "loadNo": gpLoad = null; render(); if (view === "setup") { var d2 = document.querySelector("details"); if (d2) d2.open = true; } break;
      case "resetYes": var keep = { uid: S.uid, testDevice: S.testDevice, speed: S.speed, relaxed: S.relaxed, max: S.max, voice: S.voice, sound: S.sound, len: S.len }; S = freshState(); Object.assign(S, keep); save(); gpConfirm = false; T = null; go("setup"); break;
      case "copyLog":
        var text = csv(), box = document.getElementById("csvBox");
        var fallback = function () { box.hidden = false; box.value = text; box.focus(); box.select(); };
        try { navigator.clipboard.writeText(text).then(function () { gpCopy = "Copied " + S.log.length + " rows. Paste them into a spreadsheet."; render(); }, fallback); } catch (err) { fallback(); }
        break;
    }
  });
  function onKey(k) {
    if (busy || !T || !(T.type === "flight" || T.type === "mission" || T.type === "challenge") || view === "missionEnd" || view === "challengeEnd") return;
    if (T.paused || T.meet) return;
    if (T.show) { if (k === "go") gotIt(); return; }
    if (k === "del") typed = typed.slice(0, -1);
    else if (k === "go") { if (!typed) return; return T.type === "flight" ? flightAnswer(typed) : playAnswer(typed); }
    else if (typed.length < 3) typed += k;
    var box = document.querySelector(".answer"); if (box) { box.textContent = typed || "?"; box.className = "answer" + (typed ? "" : " empty"); }
  }
  document.addEventListener("keydown", function (e) {
    if (!T || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (/^[0-9]$/.test(e.key)) { onKey(e.key); e.preventDefault(); } else if (e.key === "Backspace") { onKey("del"); e.preventDefault(); } else if (e.key === "Enter") { onKey("go"); e.preventDefault(); }
  });
  function bindHold() {
    var b = document.getElementById("gpbtn"); if (!b) return; var timer = null;
    var start = function (e) { e.preventDefault(); b.classList.add("holding"); timer = setTimeout(function () { timer = null; openGrownups(); }, 1500); };
    var stop = function () { b.classList.remove("holding"); if (timer) { clearTimeout(timer); timer = null; } };
    b.addEventListener("pointerdown", start); b.addEventListener("pointerup", stop); b.addEventListener("pointerleave", stop); b.addEventListener("pointercancel", stop);
    // keyboard (Chromebook): hold Enter or Space for 1.5 s too, so a child cannot open the area with one key press
    b.addEventListener("keydown", function (e) { if (e.key !== "Enter" && e.key !== " ") return; e.preventDefault(); if (!e.repeat && !timer) start(e); });
    b.addEventListener("keyup", function (e) { if (e.key === "Enter" || e.key === " ") stop(); });
    b.addEventListener("blur", stop);
  }

  // ---------- analytics (TelemetryDeck) ----------
  // Whitelist only: docs/analytics.md. Signals carry fixed ids and counts, never the child's name or anything typed.
  // clientUser is a random id made on this device (S.uid); TelemetryDeck hashes it again before it is stored.
  // Signals wait in the save (S.tdq) until they are sent, so play without internet still counts, with its own time.
  // Test mode everywhere except the real domain (and there too with ?test=1).
  var TD_APP = "D6E0ACED-6790-45A9-9B08-2F987355A201";
  // Test mode: every address except timesgalaxy.app, ?test=1 in the address, or a device marked as a test device
  // (S.testDevice, set by opening /play/?test=1 once, removed by /play/?test=0; JG 17 Oct 2026), so a test iPad
  // stays in test mode when the game is opened from its Home Screen icon.
  function tdTest() { return location.hostname !== "timesgalaxy.app" || TEST || !!(S && S.testDevice); }
  var td = null, tdHash = "", tdHashFor = "", inflight = null, tdReached = true;
  function uid() {
    // no save() here: a new visitor's empty state must not be stored before setup (the next save keeps the id)
    if (!S.uid) { try { S.uid = crypto.randomUUID(); } catch (e) { S.uid = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2); } }
    return S.uid;
  }
  function platform() { var ua = navigator.userAgent; return /iPad/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? "ipad" : /iPhone|iPod/.test(ua) ? "iphone" : /Android/.test(ua) ? "android" : "desktop"; }
  function signal(name, params) {
    if (!S) return;
    var p = {}, k; params = params || {};
    for (k in params) p[k] = String(params[k]);
    // "deviceKind", not "platform": TelemetryDeck fills its own top-level "platform" column, so a payload key with that name arrives as null
    p.premium = "false"; p.beta = "true"; p.deviceKind = platform(); p.installed = isInstalled() ? "true" : "false";
    uid(); S.tdq = S.tdq || [];
    if (S.tdq.length < 100) S.tdq.push({ t: name, p: p, at: new Date().toISOString(), test: tdTest() }); // test or live is decided now, not when sent
    save();
    if (tdTest()) console.log("Analytics sent:", name, p);
    sendSignals();
  }
  function once(flag, name, params) { S.sent = S.sent || {}; if (S.sent[flag]) return; S.sent[flag] = 1; signal(name, params); }
  // Sending. The body is built here in the SDK 2.0.4 format, so it can be built at once when the tab closes;
  // the SDK gives the hashed clientUser (SHA-256), the session id and the address. keepalive lets a request
  // finish after the page is gone. A signal leaves the queue when the server answered, or when it was handed
  // to a keepalive request as the tab closed.
  function withHash(cb) {
    var u = uid(); if (tdHash && tdHashFor === u) return cb();
    td._hashedClientUser(u, td.salt).then(function (h) { tdHash = h; tdHashFor = u; cb(); }, function () {});
  }
  function tdBody(b) {
    var o = { clientUser: tdHash, sessionID: td.sessionID, appID: TD_APP, type: b.t, telemetryClientVersion: "JavaScriptSDK 2.0.4", receivedAt: b.at, payload: b.p };
    if (b.test === undefined ? tdTest() : b.test) o.isTestMode = true; // older queued signals have no mark: decide now
    return o;
  }
  function tdPost(items) { return fetch(td.target, { method: "POST", mode: "cors", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify(items.map(tdBody)) }); }
  function tdDrop(items) { if (!S) return; S.tdq = (S.tdq || []).filter(function (x) { return items.indexOf(x) < 0; }); save(); }
  function sendSignals() {
    if (!td || inflight || !S || !S.tdq || !S.tdq.length || navigator.onLine === false) return;
    withHash(function () {
      if (inflight || !S.tdq.length) return;
      var batch = inflight = S.tdq.slice(0, 20);
      tdPost(batch).then(function (r) {
        tdReached = true; if (inflight === batch) inflight = null;
        if (r.ok || (r.status >= 400 && r.status < 500)) { tdDrop(batch); if (r.ok) sendSignals(); } // a 4xx would never succeed: drop it
      }, function () { tdReached = false; if (inflight === batch) inflight = null; });
    });
  }
  function sendOnHide() { // the tab is hidden or closing: send what waits, now
    // only when TelemetryDeck answered the last request: if it is unreachable, the signals stay for the next visit
    if (!td || !S || !S.tdq || !S.tdq.length || !tdHash || tdHashFor !== uid() || navigator.onLine === false || !tdReached) return;
    var going = inflight || [], rest = S.tdq.filter(function (x) { return going.indexOf(x) < 0; }).slice(0, 40);
    if (rest.length) tdPost(rest).catch(function () {});
    inflight = null; tdDrop(going.concat(rest)); // both requests are keepalive: they finish without this page
  }
  try {
    import("../vendor/telemetrydeck/telemetrydeck.js").then(function (m) {
      td = new m.default({ appID: TD_APP, clientUser: uid(), testMode: false }); // test mode is set per signal (tdBody)
      withHash(sendSignals);
    }, function () {});
  } catch (e) {}
  window.addEventListener("online", sendSignals);
  window.addEventListener("pagehide", sendOnHide);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") sendOnHide(); });

  // Signals at the end of an activity: the original functions run unchanged, the signal goes out after them.
  var MILESTONES = [1, 5, 10, 25, 50, 100];
  var origFinishFlight = finishFlight, origEndMission = endMission, origEndChallenge = endChallenge, origOpenGrownups = openGrownups, origInstallHint = installHint;
  finishFlight = function () { var asked = T ? T.i : 0; origFinishFlight(); signal("FF_done", { planetsKnown: S.parade.length, questions: asked }); };
  endMission = function () {
    if (S.missionsDone === undefined) S.missionsDone = Object.keys(S.mainDone || {}).length;
    origEndMission();
    if (T.kind === "bonus") { signal("bonus_done", { planet: T.planet || "patrol" }); return; }
    S.rateAsked = S.rateAsked || {};
    if ([2, 7, 14].indexOf(S.day) >= 0 && !S.rateAsked[S.day]) { S.rateAsked[S.day] = 1; T.askRating = true; save(); render(); } // child rating, never twice a day
    var n = ++S.missionsDone; save();
    if (MILESTONES.indexOf(n) >= 0) once("mission_done_" + n, "mission_done_" + n, { planet: T.planet || "patrol", questions: T.answered, newFacts: T.introduced.length });
  };
  endChallenge = function () {
    var t = T.planet; origEndChallenge();
    S.chTries = S.chTries || {}; S.chTries[t] = (S.chTries[t] || 0) + 1; save();
    if (T.passed) signal("challenge_passed", { planet: t, tries: S.chTries[t] }); else signal("challenge_almost", { planet: t, missing: T.missing.length });
    if (T.galaxy) signal("galaxy_done", { days: S.galaxyDone });
  };
  openGrownups = function () { var before = view; origOpenGrownups(); if (view === "grownups" && before !== "grownups") signal("grownups_open"); };
  installHint = function () { var h = origInstallHint(); if (h) once("install_hint_shown", "install_hint_shown"); return h; };
  // day_return: the first activity on calendar day 2 or 3, and on the first day >= 7, >= 14, >= 30 (decision by JG, 17 October 2026)
  function dayReturn() {
    var d = S.day;
    [2, 3].forEach(function (v) { if (d === v) once("day_return_" + v, "day_return", { day: v, streak: streak() }); });
    [7, 14, 30].forEach(function (v) { if (d >= v) once("day_return_" + v, "day_return", { day: v, streak: streak() }); });
  }
  var PAINT_IDS = { "#FF4FD8": "paint_pink", "#B8FF3D": "paint_lime", "#FFB547": "paint_gold", "#3DE0FF": "paint_blue", "#FF6B6B": "paint_red" };
  var before = null;
  document.addEventListener("click", function (e) { // runs before the game's own click handler
    var b = e.target.closest("button"); if (!b || b.disabled || !S) return;
    before = { id: b.id, hats: S.hats.length, owned: S.owned.length, at: T && T.i };
    if (/^(goLaunch|goBonus|goChallenge|startChallenge)$/.test(b.id)) dayReturn();
  }, true);
  document.addEventListener("click", function (e) { // runs after it
    var b = e.target.closest("button"), was = before; before = null; if (!b || !was || !S) return;
    if (was.id === "takeoff") signal("FF_start");
    else if (was.id === "stopMission") signal("pause_stop", { at: was.at || 0 });
    else if (was.id === "loadYes") signal("save_import");
    else if (b.dataset.hat && S.hats.length > was.hats) { var h = HATS.filter(function (x) { return x[0] === b.dataset.hat; })[0]; signal("hangar_buy", { item: "hat_" + h[0], price: h[2] }); }
    else if (b.dataset.paint && S.owned.length > was.owned) { var pt = PAINTS.filter(function (x) { return x[0] === b.dataset.paint; })[0]; signal("hangar_buy", { item: PAINT_IDS[pt[0]], price: pt[2] }); }
  });

  // a tab left open overnight: show the new day when the child comes back
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") sendSignals(); if (document.visibilityState === "visible" && S && !ACTIVE[view] && view !== "grownups" && syncDay()) render(); });

  // ---------- boot ----------
  S = load();
  if (!S) { S = freshState(); view = "setup"; } else { upgrade(S); view = S.flightDone ? "map" : "intro"; }
  // sticky test device: ?test=1 marks it, ?test=0 clears it (a new visitor's mark is stored with the first save)
  if (/[?&]test=1(&|$)/.test(location.search)) { S.testDevice = true; if (S.savedAt) save(); }
  else if (/[?&]test=0(&|$)/.test(location.search) && S.testDevice) { delete S.testDevice; save(); }
  render();
  loadMirror(); askPersist();
  // offline play after the first visit; the worker sits at the site root (../sw.js), so it covers /play/ at any address
  try { if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {}); } catch (e) {}
})();
</script>
