<style>

:root { --space: #0B1033; --panel: #141B48; --line: #3A4590; --ink: #FFFFFF; --muted: #A9B3E8; --cyan: #3DE0FF; color-scheme: dark; }

  <h1>Lost in space!</h1>

  <a id="home" href="/">Back to Times Galaxy</a>
</main>
<script>
// On a github.io project address the site lives under /<repo>/; on the custom domain it lives at /.
(function () {

})();
